<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alex Tran — AI-driven Software Engineer">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#21262d"/>
    </pattern>
    <clipPath id="card">
      <rect x="0.5" y="0.5" width="699" height="359" rx="20"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="699" height="359" rx="20" fill="#0d1117" stroke="#2e343b"/>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="700" height="360" fill="url(#dots)"/>
    <circle cx="640" cy="30" r="220" fill="url(#glowBlue)"/>
    <circle cx="60" cy="330" r="200" fill="url(#glowPurple)"/>

    <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" fill="#21262d" font-weight="700">
      <text x="40" y="90" font-size="44">&#123;</text>
      <text x="630" y="300" font-size="44">&#125;</text>
    </g>

    <g font-family="-apple-system, 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="350" y="150" font-size="74" font-weight="800" letter-spacing="1" fill="#f0f6fc">Alex Tran</text>
      <text x="350" y="207" font-size="29" font-weight="600" letter-spacing="2.5" fill="url(#accent)">AI-DRIVEN SOFTWARE ENGINEER</text>
      <text x="350" y="252" font-size="19" fill="#8b949e">Building products end to end</text>
      <text x="350" y="282" font-size="19" fill="#8b949e">mobile apps &#183; APIs &#183; databases &#183; cloud</text>
    </g>

    <rect x="290" y="308" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
</svg>

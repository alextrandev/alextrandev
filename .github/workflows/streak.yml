name: update streak card

on:
  # run automatically every 24 hours
  schedule:
    - cron: "30 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

jobs:
  streak:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # the public streak-stats instances are slow and often time out behind
      # GitHub's camo proxy, so fetch the card here with patient retries and
      # serve it from a throwaway branch instead of hotlinking it in the README
      - name: fetch streak card
        run: |
          mkdir -p dist
          params="user=${{ github.repository_owner }}&theme=github-dark-blue&border=2e343b"
          for host in "https://streak-stats.demolab.com" "https://github-readme-streak-stats.herokuapp.com"; do
            for attempt in 1 2 3; do
              if curl -sf --max-time 120 "$host/?$params" -o /tmp/streak.svg && grep -q "<svg" /tmp/streak.svg; then
                cp /tmp/streak.svg dist/streak.svg
                exit 0
              fi
              sleep 15
            done
          done
          echo "all fetch attempts failed" >&2
          exit 1

      # force-push dist to the streak-output branch, same pattern as snake.yml,
      # so the daily refresh never adds commits to main
      - name: push streak.svg to the streak-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: streak-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

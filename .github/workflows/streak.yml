name: update streak card

on:
  # run automatically every 24 hours
  schedule:
    - cron: "30 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

jobs:
  streak:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # the public streak-stats instances are slow and often time out behind
      # GitHub's camo proxy, so fetch the card here with patient retries and
      # commit it as a static asset instead of hotlinking it in the README
      - name: fetch streak card
        run: |
          params="user=${{ github.repository_owner }}&theme=github-dark-blue&border=2e343b"
          for host in "https://streak-stats.demolab.com" "https://github-readme-streak-stats.herokuapp.com"; do
            for attempt in 1 2 3; do
              if curl -sf --max-time 120 "$host/?$params" -o /tmp/streak.svg && grep -q "<svg" /tmp/streak.svg; then
                cp /tmp/streak.svg assets/streak.svg
                exit 0
              fi
              sleep 15
            done
          done
          echo "all fetch attempts failed" >&2
          exit 1

      - name: commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update streak card"
            git push
          fi
